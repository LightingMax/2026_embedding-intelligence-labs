services:
  labs:
    build: .
    volumes:
      - ./artifacts:/workspace/artifacts

  ros2:
    profiles: ["ros2"]
    build:
      context: .
      dockerfile: docker/ros2/Dockerfile
    image: embodied-book-labs-ros2:jazzy
    network_mode: host
    working_dir: /workspace/ros_ws
    volumes:
      - ./:/workspace
    environment:
      BOOK_ROS_FAULT: ${BOOK_ROS_FAULT:-none}
    command: >-
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      colcon build --symlink-install &&
      source install/setup.bash &&
      export PYTHONPATH=/workspace/src:$${PYTHONPATH:-} &&
      ros2 run embodied_book_bridge integration_demo"
